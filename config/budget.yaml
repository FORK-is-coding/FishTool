# FishTool｜HTTP 尝试配额账本（唯一账本）
#
# 依据：FishTool_前置方案_预算重分与02租约规格.md §2.2 / §2.4 / §2.6
# 口径：单账号 HTTP attempt / 滚动 24h（含签名密钥请求、重试、限速后实际发送）
#
# 硬约束：业务代码与基础设施代码里都不得出现硬编码配额数字，
#         一律从本文件读取（quota_store 读窗口，request_budget 读上限）。
# 注意：§5「待拍清单」是另一件事，本文件只落本任务给定的数字，不得顺手改配额。
version: 1

quota:
  # 单账号总闸：两域合计的硬上限（attempt / 滚动 24h）
  global_limit: 1800

  # 滚动统计窗口（小时）：used() 统计最近 window_hours 个小时桶
  window_hours: 24

  # 桶保留窗口（小时）：prune() 删除 retain 之前的桶（25 小时前的桶被裁掉）
  retention_hours: 25

  # 五类配额上限；domain 同时给出该类的归属域（总闸按全量 (域, 类别) 求和）
  categories:
    # 06 三个聚合入口（免 Cookie 域）：保底，优先保障
    discovery:
      domain: no_cookie
      limit: 480
    # 02 单视频时序采样（Cookie 域）：弹性，上限即止
    watch:
      domain: cookie
      limit: 1000
    # 01 现有榜单链路（Cookie 域）：固定
    ranking:
      domain: cookie
      limit: 150
    # 账号维护：cookie 校验 48 + wbi 刷新 24（C9 补入，Cookie 域）：固定
    maintenance:
      domain: cookie
      limit: 72
    # 机动：详情 / 标签 / 补采（Cookie 域）：应急
    flex:
      domain: cookie
      limit: 98

# 分域冷却与常规节流参数（§2.4）。两域各自冷却，互不连坐。
domains:
  cookie:
    # 单域出现 412：该域冷却 15 分钟
    cooldown_base_s: 900
    # 单域连续 3 次 412：冷却翻倍，最长 2 小时
    cooldown_max_s: 7200
    # 常规间隔下限（秒）
    min_interval_s: 1.5
    # 并发上限
    max_concurrency: 2
  no_cookie:
    cooldown_base_s: 900
    cooldown_max_s: 7200
    min_interval_s: 1.5
    max_concurrency: 2

# IP 级熔断：两域同时大量 412/403 时全局停采（两域共享同一 IP，必须一起停）
ip_circuit_breaker:
  cooldown_s: 3600

# ---------------------------------------------------------------------------
# watch 逻辑调度策略（L 层，仅 modules/hotspot/risk_control.RequestBudget 消费）
#
# 【维护者已确认：叉子，2026-10-05】原状态为「待维护者确认（pending_maintainer_approval）」，
# 已于 2026-10-05 获批「先照这组走」，获批标记：approved_maintainer_2026-10-05。
# 下面的 total / category_limits / fair_order 是 07 执行案 §10.1 提出的**初始 L 层策略**，
# 不是仓库既有常量、也不是实盘最优值（比例可按需调整，调整后请同步 policy_version）。
# 它只约束逻辑请求账本（peek/reserve/redeem 的 L 层占用），
#   ① 不改上方 quota 的 1800 与五类 HTTP 上限；
#   ② 不写 HTTP 账本、不冒充跨进程持久限额；
#   ③ 不保证各类实盘各 1500 / 1200 次真实 HTTP。
# 获批前若需上线：把 mode 改为 shared_only（category_isolation=false，如实显示类别隔离未启用）。
# 有本段但非法：加载期抛 WatchSchedulerConfigError（停 watch 采样），绝不悄悄回 shared。
# ---------------------------------------------------------------------------
watch_scheduler:
  policy_version: watch_logical_v1
  mode: partitioned            # partitioned=类别窗+总窗并行；shared_only=仅总窗（category_isolation=false）
  total:                       # 总窗（与 RequestBudget 既有默认同值；本段不新增配额）
    per_minute: 20
    per_hour: 300
    per_day: 3000
  # 类别窗：每个窗口「各类上限之和 <= 对应 total」，加载期强校验，越界即抛。
  # 10/8/2、150/120/30、1500/1200/300 为 §10.1 提案值：# approved_maintainer_2026-10-05。
  category_limits:
    normal_watch:              # 普通基础采样
      per_minute: 10           # approved_maintainer_2026-10-05（§10.1 提案，原 pending_maintainer_approval）
      per_hour: 150            # approved_maintainer_2026-10-05
      per_day: 1500            # approved_maintainer_2026-10-05
    fast_watch:                # 快信号采样（fast_until_s 生效期内）
      per_minute: 8            # approved_maintainer_2026-10-05
      per_hour: 120            # approved_maintainer_2026-10-05
      per_day: 1200            # approved_maintainer_2026-10-05
    general:                   # 同一 collector 被独立调用时仍走 acquire('general')
      per_minute: 2            # approved_maintainer_2026-10-05
      per_hour: 30             # approved_maintainer_2026-10-05
      per_day: 300             # approved_maintainer_2026-10-05
  fair_order:
    - normal_watch
    - fast_watch
