services:
  fishtool:
    build: .
    image: fishtool:local
    ports:
      - "${FISHTOOL_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      FISHTOOL_ALLOWED_HOSTS: ${FISHTOOL_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FISHTOOL_ALLOWED_PORTS: ${FISHTOOL_ALLOWED_PORTS:-8000}
    volumes:
      - fishtool-data:/app/data
      - fishtool-config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fishtool-data:
  fishtool-config:
