name: build-windows-exe

# 把 FishTool 指定 tag / commit 的源码打成单文件 Windows exe（build.spec 是 onefile 配置）。
# 默认构建最新 release v0.3.1 的源码；手动 dispatch 可换任意 tag/commit。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "FishTool 源码 tag / commit（留空默认 v0.3.1）"
        required: false
        default: "v0.3.1"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

concurrency:
  group: win-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Resolve source ref
        id: src
        shell: bash
        run: |
          ref="${{ github.event.inputs.ref }}"
          echo "ref=${ref:-v0.3.1}" >> "$GITHUB_OUTPUT"

      - name: Checkout FishTool source (upstream tag)
        uses: actions/checkout@v4
        with:
          repository: FORK-is-coding/FishTool
          ref: ${{ steps.src.outputs.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: Report artifact
        shell: pwsh
        run: |
          $exe = Get-Item dist\FishTool.exe
          "size: {0:N1} MB" -f ($exe.Length / 1MB)
          (Get-FileHash dist\FishTool.exe -Algorithm SHA256).Hash | Set-Content dist\FishTool.exe.sha256 -Encoding ascii

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FishTool-exe-${{ steps.src.outputs.ref }}-${{ github.run_number }}
          path: |
            dist/FishTool.exe
            dist/FishTool.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
